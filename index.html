<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6f57">
  <title>Bulka — správa buňky</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧽</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-256.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bulka">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo">🧽</span>
      <div>
        <h1 id="appName">Bulka</h1>
        <div id="appTagline" class="tagline"></div>
      </div>
    </div>
    <div class="header-right">
      <span id="syncDot" class="sync-dot off" title="sync"></span>
      <span id="mePicker" class="me-picker"></span>
      <button id="helpBtn" class="btn ghost sm icon-btn" title="?">❔</button>
      <button id="langToggle" class="btn ghost sm" title="CS / EN">CS/EN</button>
    </div>
  </header>

  <nav id="nav" class="nav"></nav>

  <main id="main" class="main"></main>

  <div id="modal" class="modal-wrap"></div>

  <script src="js/duties.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/rotation.js"></script>
  <script src="js/points.js"></script>
  <script src="js/expenses.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Register the service worker for offline use + installability.
    // Only works over https / localhost (e.g. GitHub Pages); silently skipped
    // when opened from a file:// path.
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
