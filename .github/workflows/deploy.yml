name: Deploy to GitHub Pages

# Publishes the static app to GitHub Pages.
# One-time setup by the repo owner: Settings -> Pages -> Build and deployment
# -> Source: "GitHub Actions". (GitHub does not let the Actions token enable
# Pages itself, so this single click is required once.)
#
# Deploys ONLY from the default branch `main`: the github-pages environment is
# protected to the default branch, so runs from feature branches fail. Ship by
# merging the working branch into main (a PR) — that triggers a deploy.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
