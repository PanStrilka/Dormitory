name: Deploy to GitHub Pages

# Publishes the static app to GitHub Pages.
# One-time setup by the repo owner: Settings -> Pages -> Build and deployment
# -> Source: "GitHub Actions". (GitHub does not let the Actions token enable
# Pages itself, so this single click is required once.) After that, every push
# to the branches below deploys automatically.

on:
  push:
    branches:
      - main
      - claude/dorm-chores-system-szgx4o
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
